<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06111f" />
<title>Fishing Tide BI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#06111f; --panel:rgba(9,31,54,.92); --panel2:rgba(15,45,76,.92);
  --line:rgba(157,215,255,.25); --text:#f5fbff; --muted:#9fb8cc;
  --cyan:#35e6ff; --blue:#1388ff; --yellow:#ffd84a; --orange:#ff8b2a; --red:#ff3d3d;
  --green:#67f6aa; --black:#020810;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;overscroll-behavior:none;}
body{display:grid;place-items:center;overflow:hidden;}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer}
.phone{
  width:min(100vw,480px); height:100dvh; max-height:980px; min-height:620px; overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 6px) 7px calc(env(safe-area-inset-bottom) + 6px);
  background:
    radial-gradient(circle at 14% 6%,rgba(42,182,255,.28),transparent 24%),
    radial-gradient(circle at 82% 34%,rgba(38,255,218,.09),transparent 26%),
    linear-gradient(180deg,#06111f 0%,#06213b 48%,#05101d 100%);
  display:grid; gap:5px;
  grid-template-rows:40px 41px 48px minmax(218px,1fr) 116px 136px 96px;
}
.topbar,.pointbar,.sunmoon,.chartCard,.nowCard,.hourly,.points{border:1px solid var(--line);background:var(--panel);box-shadow:0 10px 28px rgba(0,0,0,.28);}
.topbar{display:grid;grid-template-columns:1fr 42px 134px 42px 38px;align-items:center;gap:5px;border-radius:16px;padding:4px 6px;}
.brand{display:flex;align-items:center;gap:7px;min-width:0}.bi{display:grid;place-items:center;width:34px;height:32px;line-height:1;border-radius:5px;background:#ffd400;color:#06111f;font-weight:900;font-size:13px}.bi b{font-size:13px}.title{font-weight:900;letter-spacing:-.03em;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn,.datebtn,.gear{height:32px;border-radius:10px;background:linear-gradient(180deg,#1a5793,#0d3563);border:1px solid rgba(122,198,255,.38);font-weight:900}.navbtn{font-size:26px;line-height:1}.datebtn{font-size:15px}.gear{background:rgba(255,255,255,.08);font-size:20px}
.pointbar{border-radius:16px;display:grid;grid-template-columns:38px 1fr 68px 62px;align-items:center;gap:6px;padding:5px 7px}.star{height:32px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:24px;color:var(--yellow)}.pointname{min-width:0;line-height:1.08}.pointname span{display:block;color:var(--muted);font-size:11px}.pointname strong{display:block;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tideBadge{height:32px;border-radius:9px;background:linear-gradient(180deg,#21adff,#0b53a9);display:grid;place-items:center;font-size:19px;font-weight:900;border:1px solid rgba(95,226,255,.6)}.moonBox{height:32px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);display:grid;grid-template-columns:1fr;place-items:center;line-height:.9}.moonBox span{font-size:11px;color:var(--muted)}.moonBox b{font-size:17px;color:#fff}
.sunmoon{border-radius:15px;display:grid;grid-template-columns:1.15fr .95fr repeat(4,1fr);gap:0;overflow:hidden}.sunmoon div{display:grid;place-items:center;border-right:1px solid rgba(255,255,255,.12);padding:2px 0;line-height:1.05}.sunmoon div:last-child{border-right:0}.sunmoon b{font-size:15px;color:#fff}.sunmoon div:first-child b{font-size:19px;color:#fff}.sunmoon span{font-size:10px;color:var(--muted)}
.chartCard{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(8,45,76,.98),rgba(4,24,43,.98));min-height:0}.chartCard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(82,198,255,.14),transparent 32%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 30px);opacity:.8}#tideSvg{position:relative;width:100%;height:100%;display:block;z-index:1}.axisText{font-size:10px;fill:#eaf8ff;font-weight:700}.smallText{font-size:9px;fill:#c9e4f7}.labelText{font-size:12px;fill:#06111f;font-weight:900}.calloutTime{font-size:12px;fill:#fff;font-weight:900}.calloutCm{font-size:12px;fill:#06111f;font-weight:900}.currentText{font-size:10px;fill:#fff;font-weight:900}.fish{fill:rgba(205,246,255,.14)}
.nowCard{border-radius:16px;display:grid;grid-template-columns:1.6fr repeat(4,1fr) 1.55fr 62px;gap:4px;padding:5px;background:rgba(7,28,50,.94)}.weatherMain,.metric,.bestTime,.score{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);border-radius:12px;display:grid;place-items:center;text-align:center;min-width:0}.weatherMain{grid-row:span 2;grid-template-columns:44px 1fr;align-items:center;padding:4px}.weatherIcon{font-size:32px}.weatherMain span{display:block;font-size:11px;color:#eaf8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.weatherMain strong{display:block;font-size:24px;letter-spacing:-.05em}.metric{padding:4px 1px}.metric span,.bestTime span,.score span{font-size:10px;color:var(--muted)}.metric b{font-size:15px;white-space:nowrap}.bestTime{grid-column:2/7;grid-template-columns:72px 1fr 1fr;padding:3px;gap:3px}.bestTime b{display:grid;place-items:center;height:22px;border-radius:6px;font-size:14px;color:#06111f;background:linear-gradient(90deg,#ffd84a,#ffad2e)}.bestTime b:last-child{background:linear-gradient(90deg,#ff9f39,#ff5b3d)}.score{grid-column:7;grid-row:1/3}.score b{font-size:34px;color:var(--yellow);letter-spacing:-.06em;line-height:.95}.score small{font-size:11px;color:var(--muted);margin-top:-6px}
.hourly{border-radius:16px;overflow:hidden;background:rgba(4,18,32,.96)}.grid{height:100%;display:grid;grid-template-columns:43px repeat(9,1fr);grid-template-rows:23px 25px 22px 22px 22px 22px;font-size:11px;text-align:center}.grid>div{border-right:1px solid rgba(255,255,255,.13);border-bottom:1px solid rgba(255,255,255,.12);display:grid;place-items:center;min-width:0}.grid .rowHead{font-weight:800;color:#e8f8ff;background:rgba(255,255,255,.075)}.grid .time{font-weight:900;background:rgba(64,104,132,.35)}.grid .ico{font-size:18px;line-height:1}.grid .val{font-size:13px}.grid .tiny{font-size:10px;line-height:1.05}.grid .windArrow{font-size:17px;line-height:.8}.grid>div:nth-last-child(-n+10){border-bottom:0}
.points{border-radius:16px;padding:5px;background:rgba(5,20,36,.96)}.pointGrid{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px}.pointBtn{border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);font-weight:900;font-size:14px;line-height:1.05;display:grid;place-items:center;padding:2px}.pointBtn.active{background:linear-gradient(180deg,#159bff,#084fcb);border-color:#45e2ff;color:#fff;box-shadow:0 0 0 1px rgba(53,230,255,.35) inset}.pointBtn .miniStar{font-size:12px;color:var(--yellow);margin-top:1px}
.manageDialog{width:min(94vw,440px);border:0;padding:0;border-radius:20px;background:transparent;color:var(--text)}.manageDialog::backdrop{background:rgba(0,0,0,.72)}.managePanel{background:linear-gradient(180deg,#092641,#061321);border:1px solid rgba(153,219,255,.3);border-radius:20px;padding:12px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.dialogHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dialogHead strong{font-size:20px}.dialogHead button{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);font-size:24px}.prefTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.prefTabs button,.dialogActions button,.addGrid button{height:40px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);font-weight:900}.prefTabs button.active{background:#0c83f2}.manageList{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:220px;overflow:hidden}.manageItem{display:grid;grid-template-columns:1fr 34px;gap:5px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:5px 6px;font-size:13px}.manageItem button{width:32px;height:32px;border-radius:9px;background:rgba(255,61,61,.75);font-weight:900}.addGrid{display:grid;grid-template-columns:72px 1fr 78px 78px 64px;gap:6px;margin-top:10px}.addGrid input,.addGrid select{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);padding:0 8px;color:var(--text);min-width:0}.hint{font-size:11px;color:var(--muted);margin:8px 0}.dialogActions{display:grid;grid-template-columns:1fr 92px;gap:8px}
@media (max-width:390px){.phone{grid-template-rows:38px 39px 45px minmax(204px,1fr) 108px 126px 88px;gap:4px;padding-left:5px;padding-right:5px}.topbar{grid-template-columns:1fr 36px 118px 36px 34px}.title{font-size:13px}.datebtn{font-size:13px}.pointname strong{font-size:19px}.tideBadge{font-size:17px}.sunmoon b{font-size:13px}.sunmoon div:first-child b{font-size:16px}.nowCard{grid-template-columns:1.45fr repeat(4,1fr) 1.45fr 56px}.weatherMain strong{font-size:21px}.weatherIcon{font-size:28px}.metric b{font-size:13px}.bestTime{grid-template-columns:62px 1fr 1fr}.bestTime b{font-size:12px}.score b{font-size:28px}.grid{grid-template-columns:38px repeat(9,1fr);font-size:10px;grid-template-rows:21px 23px 20px 20px 20px 20px}.grid .val{font-size:12px}.pointBtn{font-size:12px}.addGrid{grid-template-columns:1fr 1fr;}.addGrid button{grid-column:span 2}}
@media (max-height:720px){.phone{grid-template-rows:35px 36px 40px minmax(180px,1fr) 92px 112px 76px;gap:3px}.sunmoon span,.metric span,.bestTime span,.score span{font-size:9px}.weatherMain strong{font-size:19px}.grid{grid-template-rows:18px 20px 18px 18px 18px 18px}.pointBtn{font-size:11px;border-radius:9px}.bestTime b{height:18px;font-size:11px}.weatherIcon{font-size:24px}.manageList{max-height:170px}}
/* Final icon integration */
.appLogo{
  width:34px;
  height:34px;
  border-radius:9px;
  object-fit:cover;
  box-shadow:0 0 0 1px rgba(255,216,74,.65),0 0 14px rgba(255,139,42,.28);
  flex:0 0 auto;
}
.scoreMini{
  display:grid;
  place-items:center;
  min-width:34px;
  height:30px;
  padding:0 4px;
  border-radius:7px;
  background:#ffd400;
  color:#06111f;
  font-weight:900;
  font-size:10px;
  line-height:1;
  border:1px solid rgba(255,255,255,.25);
}
.scoreMini b{font-size:13px;line-height:1;}
@media (max-width:390px){
  .appLogo{width:30px;height:30px;border-radius:8px;}
  .scoreMini{display:none;}
}

<body>
  <main class="phone" aria-label="Fishing Tide BI one page dashboard">
    <header class="topbar">
      <div class="brand"><img class="appLogo" src="icon.png" alt="ST釣り潮アイコン"><span class="title">Fishing Tide BI</span><span class="scoreMini">BI <b id="scoreBadge">--</b></span></div>
      <button id="prevDay" class="navbtn" aria-label="前日">‹</button>
      <button id="dateButton" class="datebtn" aria-label="日付">--</button>
      <button id="nextDay" class="navbtn" aria-label="翌日">›</button>
      <button id="manageButton" class="gear" aria-label="ポイント管理">⚙</button>
    </header>

    <section class="pointbar" aria-label="現在のポイント">
      <button id="favoriteButton" class="star" aria-label="お気に入り">☆</button>
      <div class="pointname"><span id="prefName">--</span><strong id="pointName">--</strong></div>
      <div class="tideBadge" id="tideType">--</div>
      <div class="moonBox"><span>月齢</span><b id="moonAge">--</b></div>
    </section>

    <section class="sunmoon" aria-label="日の出・月の出">
      <div><b id="currentTide">--cm</b><span>現在潮位</span></div>
      <div><b id="tideDiff">--</b><span>前回差</span></div>
      <div><b id="sunrise">--:--</b><span>日の出</span></div>
      <div><b id="sunset">--:--</b><span>日の入</span></div>
      <div><b id="moonrise">--:--</b><span>月の出</span></div>
      <div><b id="moonset">--:--</b><span>月の入</span></div>
    </section>

    <section class="chartCard" aria-label="タイドグラフ">
      <svg id="tideSvg" viewBox="0 0 390 256" preserveAspectRatio="none" role="img" aria-label="24時間タイドグラフ"></svg>
    </section>

    <section class="hourly" aria-label="1時間ごとの天気・風向・風速・波高">
      <div class="grid" id="hourlyGrid"></div>
    </section>

    <section class="nowCard" aria-label="現在の釣り条件">
      <div class="weatherMain">
        <div id="weatherIcon" class="weatherIcon">--</div>
        <div><span id="weatherText">取得中</span><strong id="temperature">--.-℃</strong></div>
      </div>
      <div class="metric"><span>風向</span><b id="windDir">--</b></div>
      <div class="metric"><span>風速</span><b id="windSpeed">--</b></div>
      <div class="metric"><span>波高</span><b id="waveHeight">--</b></div>
      <div class="metric"><span>水温</span><b id="waterTemp">--</b></div>
      <div class="bestTime"><span>おすすめ</span><b id="bestTime1">--:--〜--:--</b><b id="bestTime2">--:--〜--:--</b></div>
      <div class="score"><span>釣り</span><b id="fishScore">--</b><small>/100</small></div>
    </section>

    <section class="points" aria-label="ポイント選択">
      <div id="pointGrid" class="pointGrid"></div>
    </section>
  </main>

  <dialog id="manageDialog" class="manageDialog">
    <form method="dialog" class="managePanel">
      <div class="dialogHead"><strong>ポイント管理</strong><button value="close" aria-label="閉じる">×</button></div>
      <div class="prefTabs" id="prefTabs"></div>
      <div class="manageList" id="manageList"></div>
      <div class="addGrid">
        <select id="addPref" aria-label="県">
          <option>三重</option><option>愛知</option><option>静岡</option>
        </select>
        <input id="addName" placeholder="例：衣浦港" maxlength="8" />
        <input id="addLat" placeholder="緯度" inputmode="decimal" />
        <input id="addLon" placeholder="経度" inputmode="decimal" />
        <button id="addPoint" value="" type="button">登録</button>
      </div>
      <p class="hint">メイン画面は9地点まで表示。削除しても「初期に戻す」で復帰できます。</p>
      <div class="dialogActions"><button id="resetPoints" value="" type="button">初期9地点に戻す</button><button value="close">閉じる</button></div>
    </form>
  </dialog>

<script>
const DEFAULT_POINTS = [
  { name:'鈴鹿', pref:'三重', lat:34.884, lon:136.606, amp:72, base:132, phase:1.4 },
  { name:'四日市', pref:'三重', lat:34.965, lon:136.642, amp:76, base:135, phase:1.1 },
  { name:'長良川河口', pref:'三重', lat:35.056, lon:136.700, amp:82, base:140, phase:0.9 },
  { name:'名古屋港', pref:'愛知', lat:35.084, lon:136.881, amp:86, base:142, phase:0.5 },
  { name:'新舞子', pref:'愛知', lat:34.951, lon:136.826, amp:74, base:128, phase:0.6 },
  { name:'赤羽港', pref:'愛知', lat:34.612, lon:137.171, amp:58, base:108, phase:-0.1 },
  { name:'伊古部', pref:'愛知', lat:34.621, lon:137.442, amp:54, base:106, phase:-0.5 },
  { name:'浜名湖新居', pref:'静岡', lat:34.695, lon:137.562, amp:48, base:96, phase:-0.8 },
  { name:'天竜川河口', pref:'静岡', lat:34.649, lon:137.818, amp:50, base:100, phase:-1.1 }
];

const $ = id => document.getElementById(id);
const state = {
  points: loadPoints(),
  selectedName: localStorage.getItem('ftbi.selected') || '名古屋港',
  favorites: new Set(JSON.parse(localStorage.getItem('ftbi.favorites') || '["名古屋港"]')),
  dateOffset: 0,
  weather: null,
  marine: null,
  selectedPref: '愛知'
};

function loadPoints(){
  try { return JSON.parse(localStorage.getItem('ftbi.points')) || DEFAULT_POINTS; }
  catch { return DEFAULT_POINTS; }
}
function savePoints(){ localStorage.setItem('ftbi.points', JSON.stringify(state.points)); }
function saveFavs(){ localStorage.setItem('ftbi.favorites', JSON.stringify([...state.favorites])); }
function point(){ return state.points.find(p=>p.name===state.selectedName) || state.points[0] || DEFAULT_POINTS[3]; }
function selectedDate(){ const d = new Date(); d.setDate(d.getDate()+state.dateOffset); d.setHours(0,0,0,0); return d; }
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function hm(hour){ let h = Math.floor(hour)%24; let m = Math.round((hour-Math.floor(hour))*60); if(m===60){h=(h+1)%24;m=0;} return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
function fmtDate(d){ const w = '日月火水木金土'[d.getDay()]; return `${d.getMonth()+1}月${d.getDate()}日(${w})`; }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

function moonAge(date){
  const synodic = 29.530588853;
  const ref = Date.UTC(2000,0,6,18,14,0);
  const days = (Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),12)-ref)/86400000;
  return ((days % synodic) + synodic) % synodic;
}
function tideClass(age){
  const a = age;
  if(a < 1.5 || a > 28 || (a > 13.2 && a < 16.2)) return '大潮';
  if((a >= 9.5 && a < 10.8) || (a >= 24.2 && a < 25.5)) return '長潮';
  if((a >= 10.8 && a < 12.2) || (a >= 25.5 && a < 27)) return '若潮';
  if((a >= 6.7 && a < 9.5) || (a >= 21.4 && a < 24.2)) return '小潮';
  return '中潮';
}
function tideFactor(age){
  const spring = (Math.cos(2*Math.PI*age/14.765)+1)/2;
  return 0.62 + spring*0.55;
}
function tideHeight(p, hour, age){
  const amp = p.amp * tideFactor(age);
  const h = hour + p.phase + age*0.78;
  const semi = Math.sin(2*Math.PI*h/12.42);
  const daily = 0.22*Math.sin(2*Math.PI*(h-2.4)/24);
  return p.base + amp*(semi + daily);
}
function tideSeries(p, date){
  const age = moonAge(date);
  const data=[];
  for(let h=0; h<=24.001; h+=0.25){ data.push({hour:h, height:tideHeight(p,h,age)}); }
  const extrema=[];
  for(let i=1;i<data.length-1;i++){
    const prev=data[i-1].height, cur=data[i].height, next=data[i+1].height;
    if(cur>=prev && cur>=next) extrema.push({...data[i], type:'high'});
    if(cur<=prev && cur<=next) extrema.push({...data[i], type:'low'});
  }
  return {age, data, extrema};
}
function currentHour(){
  if(state.dateOffset !== 0) return 12;
  const d = new Date(); return d.getHours()+d.getMinutes()/60;
}
function sunTimes(date, lon){
  // lightweight seasonal approximation for Japan; display target only, not navigation data
  const start = new Date(date.getFullYear(),0,0);
  const n = Math.floor((date - start)/86400000);
  const latFactor = -0.75*Math.cos((n-172)/365*2*Math.PI);
  const sunrise = 5.02 + latFactor - (lon-136.8)*0.03;
  const sunset = 18.15 - latFactor - (lon-136.8)*0.03;
  return {sunrise:clamp(sunrise,4.4,7.1), sunset:clamp(sunset,16.8,19.3)};
}
function moonTimes(age){
  const rise = ((6 + age*0.82) % 24); const set = ((rise+12.2)%24); return {rise,set};
}
function weatherIcon(code, hour){
  if([0].includes(code)) return hour>=18||hour<5?'🌙':'☀️';
  if([1,2].includes(code)) return hour>=18||hour<5?'🌙':'🌤️';
  if([3].includes(code)) return '☁️';
  if([45,48].includes(code)) return '🌫️';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
  if([71,73,75,77,85,86].includes(code)) return '❄️';
  if([95,96,99].includes(code)) return '⛈️';
  return '☁️';
}
function weatherText(code){
  if(code===0) return '晴れ'; if([1,2].includes(code)) return '晴れ時々くもり'; if(code===3) return 'くもり';
  if([45,48].includes(code)) return '霧'; if([51,53,55].includes(code)) return '小雨'; if([61,63,65,80,81,82].includes(code)) return '雨';
  if([95,96,99].includes(code)) return '雷雨'; return 'くもり';
}
function compass(deg){
  if(deg == null || Number.isNaN(deg)) return '--';
  const dirs=['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
  return dirs[Math.round(deg/22.5)%16];
}
function windArrow(deg){ return `rotate(${deg || 0}deg)`; }
function nearestHourly(hourly, key, hour){
  if(!hourly || !hourly.time || !hourly[key]) return null;
  const date = ymd(selectedDate());
  let target = `${date}T${String(Math.min(23, Math.floor(hour))).padStart(2,'0')}:00`;
  let idx = hourly.time.indexOf(target);
  if(idx < 0) idx = Math.min(hourly[key].length-1, Math.max(0, Math.round(hour)));
  return hourly[key][idx];
}
function fallbackWeather(p){
  const hourly = {time:[], temperature_2m:[], relative_humidity_2m:[], precipitation:[], weather_code:[], wind_speed_10m:[], wind_direction_10m:[], wind_gusts_10m:[], surface_pressure:[]};
  const marine = {time:[], wave_height:[], wave_direction:[], sea_surface_temperature:[]};
  const date=ymd(selectedDate());
  for(let h=0;h<24;h++){
    hourly.time.push(`${date}T${String(h).padStart(2,'0')}:00`);
    const temp = 23 + 4*Math.sin((h-7)/24*2*Math.PI) + (p.pref==='静岡'?1:0);
    hourly.temperature_2m.push(+temp.toFixed(1));
    hourly.relative_humidity_2m.push(Math.round(72 - 10*Math.sin((h-8)/24*2*Math.PI)));
    hourly.precipitation.push(0);
    hourly.weather_code.push(h>18||h<5?1:2);
    hourly.wind_speed_10m.push(+(2.6 + 1.6*Math.sin((h-10)/24*2*Math.PI)).toFixed(1));
    hourly.wind_direction_10m.push(140 + 45*Math.sin(h/24*2*Math.PI));
    hourly.wind_gusts_10m.push(+(4.2 + 2*Math.sin((h-10)/24*2*Math.PI)).toFixed(1));
    hourly.surface_pressure.push(1013);
    marine.time.push(hourly.time[h]);
    marine.wave_height.push(+(p.pref==='愛知'?0.25:p.pref==='静岡'?0.45:0.3).toFixed(1));
    marine.wave_direction.push(150);
    marine.sea_surface_temperature.push(+(22.5 + 1.0*Math.sin((h-8)/24*2*Math.PI)).toFixed(1));
  }
  return {weather:{hourly}, marine:{hourly:marine}, fallback:true};
}
async function fetchData(p){
  const date = ymd(selectedDate());
  const weatherParams = new URLSearchParams({
    latitude:p.lat, longitude:p.lon, timezone:'Asia/Tokyo', start_date:date, end_date:date,
    hourly:'temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,surface_pressure'
  });
  const marineParams = new URLSearchParams({
    latitude:p.lat, longitude:p.lon, timezone:'Asia/Tokyo', start_date:date, end_date:date,
    hourly:'wave_height,wave_direction,sea_surface_temperature'
  });
  try{
    const [w,m] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?${weatherParams}`, {cache:'no-store'}),
      fetch(`https://marine-api.open-meteo.com/v1/marine?${marineParams}`, {cache:'no-store'})
    ]);
    if(!w.ok || !m.ok) throw new Error('api error');
    state.weather = await w.json(); state.marine = await m.json();
  } catch(e){
    const fb = fallbackWeather(p); state.weather = fb.weather; state.marine = fb.marine;
  }
}
function hourlyValues(hour){
  const wh = state.weather?.hourly || {}; const mh = state.marine?.hourly || {};
  return {
    temp: nearestHourly(wh,'temperature_2m',hour), hum: nearestHourly(wh,'relative_humidity_2m',hour), rain: nearestHourly(wh,'precipitation',hour), code: nearestHourly(wh,'weather_code',hour),
    wind: nearestHourly(wh,'wind_speed_10m',hour), dir: nearestHourly(wh,'wind_direction_10m',hour), gust: nearestHourly(wh,'wind_gusts_10m',hour), pressure: nearestHourly(wh,'surface_pressure',hour),
    wave: nearestHourly(mh,'wave_height',hour), water: nearestHourly(mh,'sea_surface_temperature',hour), waveDir: nearestHourly(mh,'wave_direction',hour)
  };
}
function scoreAt(hour, tideObj){
  const v = hourlyValues(hour);
  const p = point();
  const age = tideObj.age;
  const h1 = tideHeight(p, hour, age), h2 = tideHeight(p, Math.min(24,hour+1), age);
  const move = Math.abs(h2-h1);
  const sun = sunTimes(selectedDate(), p.lon);
  let s = 40;
  s += clamp(move/18,0,1)*22;
  s += Math.max(0, 1-Math.min(Math.abs(hour-sun.sunrise), Math.abs(hour-sun.sunset))/2.2)*18;
  s += (v.wave ?? 0.3) <= 0.6 ? 12 : (v.wave <= 1.0 ? 6 : -6);
  s += (v.wind ?? 3) <= 5 ? 12 : (v.wind <= 8 ? 4 : -10);
  s += (v.rain ?? 0) <= .2 ? 6 : -8;
  s += (['大潮','中潮'].includes(tideClass(age)) ? 8 : 0);
  return Math.round(clamp(s,0,100));
}
function bestWindows(tideObj){
  const arr=[]; for(let h=0;h<24;h+=0.5) arr.push({h,s:scoreAt(h,tideObj)});
  const picks=[];
  for(const row of [...arr].sort((a,b)=>b.s-a.s)){
    if(picks.every(p=>Math.abs(p.h-row.h)>4)){ picks.push(row); }
    if(picks.length===2) break;
  }
  return picks.map(p=>({start:clamp(p.h-1.25,0,23.5), end:clamp(p.h+1.25,0.5,24), score:p.s})).sort((a,b)=>a.start-b.start);
}
function createSvgEl(name, attrs={}){
  const el=document.createElementNS('http://www.w3.org/2000/svg',name);
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

    const boxW=55, boxH=30, bx=clamp(xx-boxW/2,L+2,W-R-boxW-2), by=e.type==='high'?Math.max(T+8,yy-50):Math.min(H-B-38,yy+10);

  });
  const ch=currentHour(), cv=tideHeight(p,ch,tideObj.age); const xx=x(ch), yy=y(cv);

function renderHeader(tideObj){
  const p=point(), date=selectedDate(), age=tideObj.age, cls=tideClass(age), current=tideHeight(p,currentHour(),age), prev=tideHeight(p,Math.max(0,currentHour()-0.5),age), diff=current-prev;
  const sun=sunTimes(date,p.lon), moon=moonTimes(age);

  $('tideType').textContent=cls; $('moonAge').textContent=age.toFixed(1); $('currentTide').textContent=`${Math.round(current)}cm`;
  $('tideDiff').textContent=`${diff>=0?'↑':'↓'}${Math.abs(diff).toFixed(1)}`;

}
function renderNow(tideObj){
  const h=currentHour(), v=hourlyValues(h), windows=bestWindows(tideObj), score=scoreAt(h,tideObj);
  $('weatherIcon').textContent=weatherIcon(v.code ?? 2,h); $('weatherText').textContent=weatherText(v.code ?? 2);
  $('temperature').textContent=`${(v.temp ?? 0).toFixed(1)}℃`; $('windDir').textContent=compass(v.dir); $('windSpeed').textContent=`${(v.wind ?? 0).toFixed(1)}m/s`;
  $('waveHeight').textContent=`${(v.wave ?? 0).toFixed(1)}m`; $('waterTemp').textContent=`${(v.water ?? 0).toFixed(1)}℃`;
  $('bestTime1').textContent=windows[0]?`${hm(windows[0].start)}〜${hm(windows[0].end)}`:'--:--〜--:--'; $('bestTime2').textContent=windows[1]?`${hm(windows[1].start)}〜${hm(windows[1].end)}`:'--:--〜--:--';
  $('fishScore').textContent=score; $('scoreBadge').textContent=(score/10).toFixed(1);
}
function renderHourly(){
  const g=$('hourlyGrid'); g.innerHTML='';
  const hours=[0,3,6,9,12,15,18,21,23];
  const rows=[
    ['時間',...hours.map(h=>h===23?'24':String(h))],
    ['天気',...hours.map(h=>weatherIcon(hourlyValues(h).code ?? 2,h))],
    ['気温',...hours.map(h=>`${Math.round(hourlyValues(h).temp ?? 0)}°`)],
    ['風向',...hours.map(h=>compass(hourlyValues(h).dir))],
    ['風速',...hours.map(h=>`${(hourlyValues(h).wind ?? 0).toFixed(1)}`)],

  ];

    const div=document.createElement('div');

    if(String(cell).includes('\n')){ div.innerHTML=String(cell).replace('\n','<br>'); } else div.textContent=cell;
    g.appendChild(div);
  }));
}
function renderPoints(){
  const grid=$('pointGrid'); grid.innerHTML='';
  let visible=[...state.favorites].map(n=>state.points.find(p=>p.name===n)).filter(Boolean);
  state.points.forEach(p=>{ if(!visible.find(v=>v.name===p.name)) visible.push(p); });
  visible = visible.slice(0,9);
  visible.forEach(p=>{
    const btn=document.createElement('button'); btn.className='pointBtn'+(p.name===state.selectedName?' active':'');
    btn.innerHTML=`<span>${p.name}</span><span class="miniStar">${state.favorites.has(p.name)?'★':'☆'}</span>`;
    btn.addEventListener('click',()=>{ state.selectedName=p.name; localStorage.setItem('ftbi.selected',p.name); update(); });
    grid.appendChild(btn);
  });

}
function renderManage(){
  const tabs=$('prefTabs'); tabs.innerHTML=''; ['三重','愛知','静岡'].forEach(pref=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=pref; b.className=pref===state.selectedPref?'active':'';

  });

      state.points=state.points.filter(x=>x.name!==p.name); state.favorites.delete(p.name); if(state.selectedName===p.name) state.selectedName=(state.points[0]||DEFAULT_POINTS[0]).name; savePoints(); saveFavs(); renderManage(); update();
    };

}
function openManage(){ renderManage(); $('manageDialog').showModal(); }
async function update(){
  const p=point(); renderPoints();

  await fetchData(p); renderNow(tideObj); renderHourly(); renderPoints();
}
$('prevDay').onclick=()=>{state.dateOffset--; update();}; $('nextDay').onclick=()=>{state.dateOffset++; update();}; $('dateButton').onclick=()=>{state.dateOffset=0; update();};
$('favoriteButton').onclick=()=>{ const p=point(); if(state.favorites.has(p.name)) state.favorites.delete(p.name); else state.favorites.add(p.name); saveFavs(); renderHeader(tideSeries(p,selectedDate())); renderPoints(); };
$('manageButton').onclick=openManage;
$('addPoint').onclick=()=>{
  const pref=$('addPref').value, name=$('addName').value.trim(), lat=parseFloat($('addLat').value), lon=parseFloat($('addLon').value);

  state.points.push({name,pref,lat,lon,amp:60,base:115,phase:0}); savePoints(); state.selectedPref=pref; $('addName').value=''; $('addLat').value=''; $('addLon').value=''; renderManage(); renderPoints();
};
$('resetPoints').onclick=()=>{ state.points=structuredClone(DEFAULT_POINTS); state.selectedName='名古屋港'; state.favorites=new Set(['名古屋港']); savePoints(); saveFavs(); localStorage.setItem('ftbi.selected','名古屋港'); renderManage(); update(); };
setInterval(()=>{ const p=point(); const tideObj=tideSeries(p,selectedDate()); renderHeader(tideObj); drawTideChart(tideObj); renderNow(tideObj); }, 60_000);
update();
